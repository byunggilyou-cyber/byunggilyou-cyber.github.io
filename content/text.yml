# ---------- 7. 자주 묻는 질문 ----------
faq:
  label: "FAQ"
  title: "자주 묻는 질문"
  list:
    - q: "기상 악화로 투어가 취소되면 예약금은 어떻게 됩니까?"
      a: "기상 또는 해상 상태 악화로 투어가 취소되는 경우 예약금은 전액 환불됩니다."
    - q: "게스트 사정으로 취소하면 어떻게 됩니까?"
      a: "투어 14일 전부터는 예약금이 환불되지 않습니다. 전날 또는 당일 취소 시에는 투어 요금 전액이 청구됩니다."
    - q: "오픈워터 자격으로 케라마 다이빙이 가능합니까?"
      a: "가능합니다. 레벨에 맞는 보트와 포인트를 선택해 진행합니다."
    - q: "장비 렌탈 요금은 얼마입니까?"
      a: "기본 렌탈 ¥4,000, 풀 렌탈 ¥5,000입니다. 2일차부터는 각각 ¥3,000, ¥3,500입니다."
    - q: "겨울에도 다이빙할 수 있습니까?"
      a: "오키나와는 연중 다이빙이 가능합니다. 겨울철에는 보트코트와 추가 웻슈트 등 방한 장비를 무료로 제공합니다."


